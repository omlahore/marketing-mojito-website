  <script>
document.addEventListener("DOMContentLoaded", function () {
  /* ===============================
     CONTACT FORM (Web3Forms)
  =============================== */
  const contactForm = document.getElementById("contact-form");
  const formWrapper = document.querySelector(".contact-form-wrapper");
  if (contactForm) {
    contactForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = contactForm.querySelector("button");
      if (!btn) return;
      const originalText = btn.textContent;
      const botcheck = contactForm.querySelector('input[name="botcheck"]');
      if (botcheck && botcheck.checked) return;
      btn.textContent = "Sending...";
      btn.disabled = true;
      try {
        const formData = new FormData(contactForm);
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (data.success) {
          if (formWrapper) {
            formWrapper.innerHTML =
              '<div class="success-message">✅ Thank you! Your message has been sent successfully.</div>';
          }
        } else {
          throw new Error("Submission failed");
        }
      } catch (error) {
        btn.textContent = originalText;
        btn.disabled = false;
        alert("⚠️ Something went wrong. Please try again.");
      }
    });
  }
  /* ===============================
     GENERIC FORM → VERCEL API
  =============================== */
  const genericForm = document.querySelector("form");
  if (genericForm) {
    genericForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.querySelector("#email")?.value || "";
      const name = document.querySelector("#name")?.value || "";
      const referer = window.location.href;
      if (!email) {
        alert("❗ Please enter your email.");
        return;
      }
      try {
        const response = await fetch(
          "https://webflow-form-handler-ovs7fq09k-omlahores-projects.vercel.app/api/form",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, referer })
          }
        );
        if (response.ok) {
          alert("✅ Checklist sent! Check your inbox.");
          genericForm.reset();
        } else {
          alert("⚠️ Something went wrong. Try again later.");
        }
      } catch (err) {
        console.error("Form error:", err);
        alert("🚫 Could not send. Try again.");
      }
    });
  }
  /* ===============================
     MAKE.COM WEBHOOK (QUIET)
  =============================== */
  document.querySelectorAll("form").forEach(function (form) {
    form.addEventListener("submit", function () {
      const formData = new FormData(form);
      fetch("https://hook.eu2.make.com/tdyp1qqte963gttwi08kiu1d5av75h7q", {
        method: "POST",
        body: formData
      });
      if (form.querySelector(".w-form-done"))
        form.querySelector(".w-form-done").style.display = "none";
      if (form.querySelector(".w-form-fail"))
        form.querySelector(".w-form-fail").style.display = "none";
    });
  });
});
</script>
